<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>byo — local agent</title>
  <script>
    // Theme: light by default; a saved choice wins. Runs before CSS to avoid a flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('byo-theme'); } catch (error) { saved = null; }
      document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-sticker">byo</span></div>
    <nav id="nav">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#chat" data-view="chat">Chat</a>
      <a href="#observe" data-view="observe">Observability</a>
      <a href="#memory" data-view="memory">Memory</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
    <button type="button" id="theme-toggle" class="theme-toggle">theme: light</button>
    <div class="home" id="home-path"></div>
  </aside>
  <main id="view"></main>
  <aside class="chat-rail" id="chat-rail" aria-label="Chat">
    <div class="chat-head">Chat</div>
    <div class="chat-scroll">
      <div id="chat-live"></div>
      <div id="chat-history"></div>
    </div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" placeholder="Ask for something, or say what to remember" autocomplete="off">
      <button type="submit" class="primary">Send</button>
    </form>
  </aside>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/render.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/live.js"></script>
  <script src="/static/js/observe.js"></script>
  <script src="/static/js/dock.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
