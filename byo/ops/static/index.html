<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Theme: light by default; a saved choice wins. Runs before CSS to avoid a flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('byo-theme'); } catch (error) { saved = null; }
      document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <title>byo — local agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/brand/mark.svg">
</head>
<body>
  <nav id="nav" class="rail">
    <div class="r-top">
      <span class="brand">
        <svg class="brand-wordmark" role="img" aria-label="byo" viewBox="-357.9 -124.5 2617.9 1706">
          <!-- byo wordmark, header inline form — paints follow the page's byo-* tokens: sticker = byo-accent-brand; letters/contour = byo-ink-on-accent (stays dark on the yellow plate in both schemes); shadow = byo-ink (flips with the theme, like every other shadow on the page). -->
          <!-- letters: Zilla Slab Bold outlines (SIL OFL 1.1), composed on one baseline; -->
          <!-- the sticker plate tilts -2.0deg, the letters stay upright. -->
          <g transform="rotate(-2.0 862 645.5)">
          <!-- hard offset shadow: theme token byo-shadow-rest, zero blur -->
          <rect x="-77.9" y="172.1" width="2224" height="1291" rx="129.1" fill="var(--byo-ink)"/>
          <!-- the sticker plate -->
          <rect x="-250" y="0" width="2224" height="1291" rx="129.1" fill="var(--byo-accent-brand)" stroke="var(--byo-ink-on-accent)" stroke-width="86.1"/>
        </g>
          <g fill="var(--byo-ink-on-accent)">
          <path transform="translate(0 868) scale(1 -1)" d="M530 236Q530 136 477.5 63Q425 -10 323 -10Q220 -10 178 68Q176 51 173.5 34Q171 17 168 0H39Q46 35 51 70Q56 105 56 139V590H-4V688H185V365Q203 404 239.5 432Q276 460 337 460Q422 460 476 401Q530 342 530 236ZM396 225Q396 290 368 324Q340 358 294 358Q242 358 213.5 320Q185 282 185 232V221Q185 166 212.5 128.5Q240 91 291 91Q335 91 365.5 123.5Q396 156 396 225Z"/> <!-- b -->
          <path transform="translate(611 868) scale(1 -1)" d="M523 354H479L334 0L291 -113H350V-213H101V-113H173L209 -7L51 354H5V451H235V354H190L282 146H288L356 354H317V451H523Z"/> <!-- y -->
          <path transform="translate(1201 868) scale(1 -1)" d="M503 225Q503 118 433 54Q363 -10 255 -10Q151 -10 85.5 50.5Q20 111 20 220Q20 319 80 390Q140 461 262 461Q384 461 443.5 390.5Q503 320 503 225ZM370 229Q370 298 338 330Q306 362 260 362Q210 362 181.5 326.5Q153 291 153 227Q153 169 179.5 129Q206 89 259 89Q309 89 339.5 126.5Q370 164 370 229Z"/> <!-- o -->
        </g>
        </svg>
        <img class="brand-mark" src="/static/brand/mark.svg" alt="byo" width="30" height="30">
      </span>
      <button id="nav-collapse" class="r-chev" aria-label="Collapse the sidebar" aria-expanded="true">&#8249;</button>
    </div>
    <div class="r-grp">System</div>
    <a href="#overview" data-view="overview" data-short="O" aria-label="Overview"><span class="lbl">Overview</span></a>
    <a href="#tools" data-view="tools" data-short="T" aria-label="Tools"><span class="lbl">Tools</span></a>
    <a href="#memory" data-view="memory" data-short="M" aria-label="Memory"><span class="lbl">Memory</span></a>
    <a href="#observe" data-view="observe" data-short="B" aria-label="Observability"><span class="lbl">Observability</span></a>
    <div class="r-grp">Setup</div>
    <a href="#settings" data-view="settings" data-short="S" aria-label="Settings"><span class="lbl">Settings</span></a>
    <div class="r-bottom">
      <button type="button" id="theme-toggle" class="theme-toggle">theme: light</button>
      <div class="home" id="home-path"></div>
    </div>
  </nav>
  <main>
    <header class="pagehead">
      <div class="ph-row"><h1 id="title">Overview</h1><div id="ph-actions" class="ph-actions"></div></div>
      <div class="sub" id="sub"></div>
    </header>
    <div id="view"></div>
  </main>
  <div class="resizer" id="dock-resizer" title="Drag to resize chat"></div>
  <aside id="dock">
    <div class="dockhead">
      <span class="dt">Chat</span>
      <button id="dock-close" title="Collapse chat" aria-label="Collapse chat">&rsaquo;</button>
    </div>
    <div class="sesshead">
      <button type="button" id="new-chat" class="sessbtn">+ New chat</button>
      <select id="chat-sessions" class="sessbtn" title="History" aria-label="Chat history"></select>
    </div>
    <div class="chatlog" id="docklog">
      <!-- Oldest first: the transcript reads top to bottom, and the live card (the
           newest turn) sits at the bottom where the eye already is. -->
      <div id="chat-history"></div>
      <div id="chat-live"></div>
    </div>
    <form class="chatbar" id="chat-form" autocomplete="off">
      <textarea id="chat-input" rows="1" placeholder="Ask for something, or say what to remember" autocomplete="off"></textarea>
      <div class="chatbar-actions">
        <button type="submit" class="primary">Send</button>
      </div>
    </form>
  </aside>
  <button id="dock-reopen" class="primary" title="Open chat">&lsaquo; Chat</button>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/render.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/live.js"></script>
  <script src="/static/js/observe.js"></script>
  <script src="/static/js/dock.js"></script>
  <script src="/static/js/tools.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
